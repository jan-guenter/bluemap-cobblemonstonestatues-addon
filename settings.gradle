pluginManagement {
    def toolkitPath = 'tooling/bluemap-addon-toolkit'
    def expectedToolkitCommit = '6cd34a8368cc4ee8628fbe830a90ec5b14960629'
    def adapterApiPath = 'modules/bluemap-addon-adapter-api'
    def expectedAdapterApiCommit = 'e81f08bc4bfbf02d810ec8949a019130e2e61634'
    def expectedAdapterApiSourceTree = '2f974c9bb2ba13888d69682f86f30f58922d30eb'
    def consumerRoot = settings.settingsDir
    def toolkit = new File(consumerRoot, toolkitPath)
    def adapterApi = new File(consumerRoot, adapterApiPath)
    def adapterApiSource = new File(adapterApi, 'src/main/java')

    if (!(expectedToolkitCommit ==~ /[0-9a-f]{40}/)
            || !new File(consumerRoot, '.git').exists()
            || !toolkit.isDirectory()
            || !new File(toolkit, '.git').exists()) {
        throw new GradleException(
                'Toolkit trust preflight is not configured or initialized. '
                        + "Run: git submodule update --init --recursive -- ${toolkitPath}"
        )
    }
    if (!(expectedAdapterApiCommit ==~ /[0-9a-f]{40}/)
            || !(expectedAdapterApiSourceTree ==~ /[0-9a-f]{40}/)
            || !adapterApi.isDirectory()
            || !new File(adapterApi, '.git').exists()
            || !adapterApiSource.isDirectory()) {
        throw new GradleException(
                'Adapter API trust preflight is not configured or initialized. '
                        + "Run: git submodule update --init --recursive -- ${adapterApiPath}"
        )
    }

    def toolkitGitOutput = {
        File repository, List<String> arguments, String operation ->
        def execution = settings.providers.exec {
            commandLine(['git', '-C', repository.absolutePath] + arguments)
            ignoreExitValue = true
            environment 'LC_ALL', 'C'
            environment 'GIT_OPTIONAL_LOCKS', '0'
        }
        def result = execution.result.get()
        def output = execution.standardOutput.asText.get().trim()
        def error = execution.standardError.asText.get().trim()
        if (result.exitValue != 0) {
            throw new GradleException(
                    "Unable to ${operation}: ${error ?: 'Git returned no diagnostic.'}"
            )
        }
        output
    }

    if (!toolkitGitOutput(consumerRoot, ['rev-parse', '--show-prefix'],
            'verify the consumer root').isEmpty()) {
        throw new GradleException('settings.gradle must be at the Git worktree root')
    }

    def tree = toolkitGitOutput(consumerRoot, ['ls-tree', 'HEAD', '--', toolkitPath],
            'read the committed toolkit gitlink').tokenize(' \t')
    def index = toolkitGitOutput(consumerRoot, ['ls-files', '--stage', '--', toolkitPath],
            'read the indexed toolkit gitlink').tokenize(' \t')
    if (tree.size() != 4 || tree[0] != '160000' || tree[1] != 'commit'
            || tree[2] != expectedToolkitCommit || tree[3] != toolkitPath
            || index.size() != 4 || index[0] != '160000'
            || index[1] != expectedToolkitCommit || index[2] != '0'
            || index[3] != toolkitPath) {
        throw new GradleException('Committed/indexed toolkit gitlink does not match its pin')
    }

    def toolkitHead = toolkitGitOutput(toolkit,
            ['rev-parse', '--verify', 'HEAD^{commit}'], 'read toolkit HEAD')
    def toolkitStatus = toolkitGitOutput(toolkit,
            ['status', '--porcelain=v1', '--untracked-files=all',
             '--ignore-submodules=none'], 'verify the toolkit worktree')
    if (toolkitHead != expectedToolkitCommit || !toolkitStatus.isEmpty()) {
        throw new GradleException('Toolkit HEAD differs from the gitlink or is dirty')
    }

    def adapterApiTree = toolkitGitOutput(consumerRoot,
            ['ls-tree', 'HEAD', '--', adapterApiPath],
            'read the committed Adapter API gitlink').tokenize(' \t')
    def adapterApiIndex = toolkitGitOutput(consumerRoot,
            ['ls-files', '--stage', '--', adapterApiPath],
            'read the indexed Adapter API gitlink').tokenize(' \t')
    if (adapterApiTree.size() != 4 || adapterApiTree[0] != '160000'
            || adapterApiTree[1] != 'commit'
            || adapterApiTree[2] != expectedAdapterApiCommit
            || adapterApiTree[3] != adapterApiPath
            || adapterApiIndex.size() != 4 || adapterApiIndex[0] != '160000'
            || adapterApiIndex[1] != expectedAdapterApiCommit
            || adapterApiIndex[2] != '0' || adapterApiIndex[3] != adapterApiPath) {
        throw new GradleException(
                'Committed/indexed Adapter API gitlink does not match its pin'
        )
    }

    def adapterApiHead = toolkitGitOutput(adapterApi,
            ['rev-parse', '--verify', 'HEAD^{commit}'], 'read Adapter API HEAD')
    def adapterApiTreeHash = toolkitGitOutput(adapterApi,
            ['rev-parse', 'HEAD:src/main/java'], 'read Adapter API source tree')
    def adapterApiStatus = toolkitGitOutput(adapterApi,
            ['status', '--porcelain=v1', '--untracked-files=all',
             '--ignore-submodules=none'], 'verify the Adapter API worktree')
    if (adapterApiHead != expectedAdapterApiCommit
            || adapterApiTreeHash != expectedAdapterApiSourceTree
            || !adapterApiStatus.isEmpty()) {
        throw new GradleException(
                'Adapter API HEAD/source tree differs from the pin or is dirty'
        )
    }

    def gradleBuild = new File(toolkit, 'gradle')
    if (!new File(gradleBuild, 'settings.gradle').isFile()) {
        throw new GradleException('Pinned toolkit has no Gradle convention build')
    }
    includeBuild(gradleBuild)

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'bluemap-cobblemonstonestatues-addon'

def expectedBlueMapCommit = '7e07f4e74ec1e92a6ead9aa1e66054af3e133aac'
def expectedBlueMapApiCommit = '285c9a60eff3ac2b0cab308ce1058d1565be0971'
def blueMapSourcePath = providers.gradleProperty('bluemapSourcePath')
        .getOrElse('../bluemap-backport')
def blueMapSource = file(blueMapSourcePath)

if (!blueMapSource.isDirectory()) {
    throw new GradleException(
            "BlueMap source checkout not found at ${blueMapSource}. "
                    + 'Set -PbluemapSourcePath=<path> to the exact workspace backport.'
    )
}

def gitOutput = { File repository, String... arguments ->
    providers.exec {
        commandLine(['git', '-C', repository.absolutePath] + arguments.toList())
    }.standardOutput.asText.get().trim()
}

def blueMapHead = gitOutput(blueMapSource, 'rev-parse', '--verify', 'HEAD^{commit}')
if (blueMapHead != expectedBlueMapCommit) {
    throw new GradleException("Refusing BlueMap ${blueMapHead}; expected ${expectedBlueMapCommit}")
}
def blueMapApiSource = new File(blueMapSource, 'api')
def blueMapApiHead = gitOutput(blueMapApiSource, 'rev-parse', '--verify', 'HEAD^{commit}')
if (blueMapApiHead != expectedBlueMapApiCommit) {
    throw new GradleException(
            "Refusing BlueMapAPI ${blueMapApiHead}; expected ${expectedBlueMapApiCommit}"
    )
}

includeBuild(blueMapSource) {
    dependencySubstitution {
        substitute module('de.bluecolored:bluemap-core') using project(':core')
    }
}
