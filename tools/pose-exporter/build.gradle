tasks.register('verifyPomLicenses') {
    dependsOn tasks.named('generatePomFileForExporterPublication')
    def pom = layout.buildDirectory.file('publications/exporter/pom-default.xml')
    inputs.file(pom)
    doLast {
        def parsed = new groovy.xml.XmlSlurper().parse(inputs.files.singleFile)
        def names = parsed.licenses.license.name*.text() as Set
        if (names != ['MIT License', 'Mozilla Public License 2.0'] as Set
                || parsed.scm.url.text()
                != 'https://github.com/jan-guenter/bluemap-cobblemonstonestatues-addon') {
            throw new GradleException('Exporter POM licensing/source metadata mismatch')
        }
    }
}

tasks.register('verifyPublicationMetadata') {
    dependsOn tasks.named('generatePomFileForExporterPublication')
    dependsOn tasks.named('generateMetadataFileForExporterPublication')
    def pomFile = layout.buildDirectory.file('publications/exporter/pom-default.xml')
    def moduleFile = layout.buildDirectory.file('publications/exporter/module.json')
    inputs.files(pomFile, moduleFile)

    doLast {
        String pom = pomFile.get().asFile.getText('UTF-8')
        for (String exact : [
                "<groupId>${mod_group_id}</groupId>",
                "<artifactId>${artifact_id}</artifactId>",
                "<version>${project.version}</version>",
                '<name>ATMons Stone Pose Exporter</name>',
                '<name>MIT License</name>',
                '<name>Mozilla Public License 2.0</name>'
        ]) {
            if (!pom.contains(exact)) {
                throw new GradleException(
                        "Exporter publication POM is missing exact value: ${exact}"
                )
            }
        }
        def module = new groovy.json.JsonSlurper().parse(moduleFile.get().asFile)
        if (module.component.group != mod_group_id
                || module.component.module != artifact_id
                || module.component.version != project.version.toString()) {
            throw new GradleException('Exporter Gradle module coordinates changed')
        }
        def publishedFiles = module.variants.collectMany { it.files ?: [] }
                .collect { it.name }.toSet()
        if (publishedFiles != Set.of(
                "${artifact_id}-${project.version}.jar",
                "${artifact_id}-${project.version}-sources.jar"
        )) {
            throw new GradleException(
                    "Exporter Gradle module payload roster changed: ${publishedFiles}"
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyExactCompileOnlyArtifacts')
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
    dependsOn 'verifyPomLicenses'
    dependsOn tasks.named('verifyPublicationMetadata')
}

tasks.named('jar').configure {
    dependsOn tasks.named('verifyExactCompileOnlyArtifacts')
}
