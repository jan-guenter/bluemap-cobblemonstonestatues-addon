plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

group = mod_group_id
version = mod_version

base {
    archivesName = artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.named('main').configure {
    java {
        srcDir '../../src/main/java'
        include 'io/github/janguenter/stoneposeexporter/**'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/pose/PoseState.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/pose/PoseStateCodec.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/catalog/FormatTwoBudgets.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/BedrockGeometry.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/BedrockGeometryParser.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/BakedGeometryTopology.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/GeometryTopologyDigest.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/QuadMultisetDigest.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/CleanRoomGeometryCompiler.java'
        include 'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/cleanroom/**'
    }
}

sourceSets.named('test').configure {
    java {
        srcDir '../../src/test/java'
        include 'io/github/janguenter/stoneposeexporter/**'
        include('io/github/janguenter/bluemap/cobblemonstonestatues/geometry/cleanroom/'
                + 'BedrockBoxReplayTest.java')
        include('io/github/janguenter/bluemap/cobblemonstonestatues/geometry/cleanroom/'
                + 'RuntimeFixtureParityTest.java')
        include('io/github/janguenter/bluemap/cobblemonstonestatues/geometry/cleanroom/'
                + 'CleanRoomReplayJUnitTest.java')
    }
    // The runtime-parity test deliberately compiles against the exact mapped Minecraft API.
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

neoForge {
    version = neoforge_version
    mods {
        atmons_stone_pose_exporter {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://thedarkcolour.github.io/KotlinForForge/')
        content { includeGroup('thedarkcolour') }
    }
}

