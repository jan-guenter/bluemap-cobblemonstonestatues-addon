                label: 'Stone Statues 1.1',
                source: stoneJar,
                size: 170977L,
                sha256: '0fece8e5a988b660f2b608a316f88e2572290835fec1acf67d78329133e92f09'
        ],
        [
                label: 'Cobblemon 1.7.3+1.21.1',
