    extendsFrom configurations.named('compileOnly').get()
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'stoneRuntimeFixture', providers.gradleProperty('stoneRuntimeFixture')
            .getOrElse(file(
                    '../../provenance/cleanroom/stone-box-replay/fixtures.ndjson'
            ).absolutePath)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.register('verifyExactCompileOnlyArtifacts') {
    inputs.files(exactCompileOnlyArtifacts.collect { it.source })
    doLast {
        exactCompileOnlyArtifacts.each { identity ->
            File candidate = identity.source.get()
            if (!candidate.isFile() || candidate.length() != identity.size) {
                throw new GradleException(
                        "${identity.label} exact compile-only size mismatch: ${candidate}"
                )
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            def actual = java.util.HexFormat.of().formatHex(digest.digest())
            if (actual != identity.sha256) {
                throw new GradleException(
                        "${identity.label} exact compile-only SHA-256 mismatch: ${candidate}"
                )
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyExactCompileOnlyArtifacts')
}

tasks.named('processResources', ProcessResources).configure {
    def values = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties(values)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(values)
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}

