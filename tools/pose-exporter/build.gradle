tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def retiredFormatOneEntry = { String path ->
    path.contains('MeshCodec')
            || path == 'pose-catalog.json'
            || path.endsWith('/pose-catalog.json')
            || path.startsWith('meshes/')
            || path.contains('/meshes/')
}
def retiredFormatOneProbes = [
        'io/example/MeshCodec.class',
        'io/example/MeshCodec$Header.class',
        'io/example/MeshCodec.java',
        'meshes/legacy.bin',
        'nested/meshes/legacy.bin',
        'pose-catalog.json',
        'nested/pose-catalog.json'
]
def hasUnexpandedMetadata = { String text -> text.contains('${') }
def acceptedHelperNoticeSha256 =
        '71b7545cda2a26fc2f3edffec9430e27a1da4d6d84373aaa248d02b7b719a20e'
def unexpandedMetadataProbes = [
        'version = "${mod_version}"',
        'modId = "${mod_id}"',
        'displayName = "${mod_name}"'
]

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        if (!retiredFormatOneProbes.every(retiredFormatOneEntry)) {
            throw new GradleException('Retired format-1 exporter guard is incomplete')
        }
        if (!unexpandedMetadataProbes.every(hasUnexpandedMetadata)) {
            throw new GradleException('Unexpanded exporter metadata guard is incomplete')
        }
        new java.util.zip.ZipFile(inputs.files.singleFile).withCloseable { zip ->
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'META-INF/neoforge.mods.toml',
                    'META-INF/LICENSE-atmons-stone-pose-exporter',
                    'META-INF/licenses/MPL-2.0.txt',
                    'META-INF/LICENSES-atmons-stone-pose-exporter.md',
                    'META-INF/NOTICE-atmons-stone-pose-exporter.md',
                    'META-INF/SOURCE-OFFER-atmons-stone-pose-exporter.md',
                    'META-INF/THIRD_PARTY-atmons-stone-pose-exporter.md',
                    'META-INF/atmons-stone-pose-exporter/upstreams.json',
                    'atmons_stone_pose_exporter.mixins.json',
                    'io/github/janguenter/stoneposeexporter/StonePoseExporterMod.class',
                    'io/github/janguenter/stoneposeexporter/PoseCaptureHook.class',
                    'io/github/janguenter/stoneposeexporter/ModelBindingObserverCore.class',
                    'io/github/janguenter/stoneposeexporter/ModelResourceBindings.class',
                    'io/github/janguenter/stoneposeexporter/ResourceAdmissionBudget.class',
                    'io/github/janguenter/stoneposeexporter/mixin/PosableModelCaptureMixin.class',
                    'io/github/janguenter/stoneposeexporter/mixin/'
                            + 'VaryingModelRepositoryResourceMixin.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/pose/PoseState.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/pose/'
                            + 'PoseState$RuntimeFrame.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/pose/'
                            + 'PoseState$MirrorZeroXNormals.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/pose/PoseStateCodec.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/catalog/'
                            + 'FormatTwoBudgets.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                            + 'BakedGeometryTopology.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                            + 'QuadMultisetDigest.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                            + 'CleanRoomGeometryCompiler.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                            + 'cleanroom/BedrockBoxReplay.class',
                    'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                            + 'cleanroom/JomlAdapters.class'
            ]
            def missing = required.findAll { !entries.contains(it) }
            def foreignClasses = entries.findAll {
                it.endsWith('.class')
                        && !it.startsWith('io/github/janguenter/stoneposeexporter/')
                        && !it.startsWith(
                        'io/github/janguenter/bluemap/cobblemonstonestatues/pose/'
                )
                        && !it.startsWith(
                        'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                )
                        && !it.startsWith(
                        'io/github/janguenter/bluemap/cobblemonstonestatues/catalog/'
                )
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar') || it.endsWith('.png') || it.endsWith('.geo.json')
                        || it.endsWith('.ndjson') || it.endsWith('LGPL-2.1-only.txt')
                        || it.endsWith('.animation.json')
                        || it.startsWith('assets/cobblemon/')
                        || it.startsWith('assets/cobblemonstonestatues/')
                        || it.startsWith('com/cobblemon/')
                        || it.startsWith('com/jorgaomc/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith('kotlin/')
                        || retiredFormatOneEntry(it)
                        || it.startsWith(
                        'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                                + 'GeometryReplayCompiler'
                )
                        || it.startsWith(
                        'io/github/janguenter/bluemap/cobblemonstonestatues/geometry/'
                                + 'GeometryMeshCompiler'
                )
            }
            if (!missing.isEmpty() || !forbidden.isEmpty() || !foreignClasses.isEmpty()) {
                throw new GradleException(
                        "Exporter JAR boundary mismatch: missing=${missing}, "
                                + "forbidden=${forbidden}, foreignClasses=${foreignClasses}"
                )
            }
            def upstreams = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry(
                            'META-INF/atmons-stone-pose-exporter/upstreams.json'
                    )).getText('UTF-8')
            )
            if (upstreams.bluemap.license != 'MIT'
                    || upstreams.cleanroom_box_replay.fixture_sha256
                    != 'b287b9ff5b6bdd0aa9d7bf04865a1d9bb28f772e59b10333c224ea552fbc848f') {
                throw new GradleException('Exporter packaged provenance drifted')
            }
            def mplSha = java.util.HexFormat.of().formatHex(
                    java.security.MessageDigest.getInstance('SHA-256').digest(
                            zip.getInputStream(zip.getEntry(
                                    'META-INF/licenses/MPL-2.0.txt'
                            )).bytes
                    )
            )
            if (mplSha != '1f256ecad192880510e84ad60474eab7589218784b9a50bc7ceee34c2b91f1d5') {
                throw new GradleException('Exporter MPL-2.0 license text drifted')
            }
            def noticeSha = java.util.HexFormat.of().formatHex(
                    java.security.MessageDigest.getInstance('SHA-256').digest(
                            zip.getInputStream(zip.getEntry(
                                    'META-INF/THIRD_PARTY-atmons-stone-pose-exporter.md'
                            )).bytes
                    )
            )
            if (noticeSha != acceptedHelperNoticeSha256) {
                throw new GradleException('Exporter artifact-time notice drifted')
            }
            def resourceMixin = new String(zip.getInputStream(zip.getEntry(
                    'io/github/janguenter/stoneposeexporter/mixin/'
                            + 'VaryingModelRepositoryResourceMixin.class'
            )).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (!resourceMixin.contains('Ljava/io/InputStream;readAllBytes()[B')
                    || resourceMixin.contains('Ljava/io/InputStream;readAllBytes:()[B')) {
                throw new GradleException('Exporter exact-byte Mixin selector drifted')
            }
            def controllerClass = new String(zip.getInputStream(zip.getEntry(
                    'io/github/janguenter/stoneposeexporter/StonePoseExportController.class'
            )).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            def engineClass = new String(zip.getInputStream(zip.getEntry(
                    'io/github/janguenter/stoneposeexporter/StonePoseExportEngine.class'
            )).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (!engineClass.contains(
                    '(Ljava/io/InputStream;)Lcom/mojang/blaze3d/platform/NativeImage;'
            ) || engineClass.contains(
                    '([B)Lcom/mojang/blaze3d/platform/NativeImage;'
            )) {
                throw new GradleException('Exporter PNG decode path is not streaming')
            }
            if (controllerClass.contains(
                    'Hybrid pose-state export is not wired; this development build is inactive.'
            )
                    || !controllerClass.contains(
                    'Stone pose export started on the render thread.'
            )
                    || !controllerClass.contains('StonePoseExportEngine')
                    || !controllerClass.contains('Stone pose export is already running.')
                    || !controllerClass.contains(
                    'Resources are reloading; wait and retry.'
            )) {
                throw new GradleException('Exporter enabled command bytecode drifted')
            }
            def metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml'))
                    .getText('UTF-8')
            def manifest = new java.util.jar.Manifest(zip.getInputStream(
                    zip.getEntry('META-INF/MANIFEST.MF')
            )).mainAttributes
            def expectedName = "${artifact_id}-${project.version}.jar"
            if (hasUnexpandedMetadata(metadata)
                    || metadata.count("modId = \"${mod_id}\"") != 1
                    || metadata.count("version = \"${project.version}\"") != 1
                    || metadata.count("displayName = \"${mod_name}\"") != 1
                    || metadata.count("[[dependencies.${mod_id}]]") != 4
                    || inputs.files.singleFile.name != expectedName
                    || manifest.getValue('Implementation-Version')
                    != project.version.toString()
                    || metadata.count('side = "CLIENT"') != 4
                    || !metadata.contains('license = "MIT AND MPL-2.0"')
                    || metadata.contains('side = "SERVER"')
                    || metadata.contains('side = "BOTH"')
                    || metadata.count('[[mixins]]') != 1
                    || metadata.count(
                    'config = "atmons_stone_pose_exporter.mixins.json"'
            ) != 1) {
                throw new GradleException('Exporter metadata is not strictly client-only')
            }
            def mixins = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry(
                            'atmons_stone_pose_exporter.mixins.json'
                    )).getText('UTF-8')
            )
            if (mixins.required != true
                    || mixins.minVersion != '0.8.7'
                    || mixins.compatibilityLevel != 'JAVA_21'
                    || mixins.package != 'io.github.janguenter.stoneposeexporter.mixin'
                    || mixins.client != [
                    'PosableModelCaptureMixin', 'VaryingModelRepositoryResourceMixin'
            ]
                    || mixins.mixins != null || mixins.server != null
                    || mixins.injectors?.defaultRequire != 1) {
                throw new GradleException('Exporter Mixin configuration is not client-only')
            }
        }
    }
}

def exporterSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }

