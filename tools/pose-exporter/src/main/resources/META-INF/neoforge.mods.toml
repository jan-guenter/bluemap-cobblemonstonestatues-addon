modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT AND MPL-2.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Jan Guenter"
description = '''
Client-only, fixed-path exporter for an operator-local exact Stone Statues
hybrid pose-state bundle. It has no network listener and redistributes no
Pokémon assets or final meshes.
'''

[[mixins]]
config = "atmons_stone_pose_exporter.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.248,21.1.249)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "[1.7.3,1.7.4)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "cobblemonstonestatues"
type = "required"
versionRange = "[1.1,1.2)"
ordering = "AFTER"
side = "CLIENT"
